# Yawei Tiger auxiliary-key layout.
#
# The option name is the Tiger letter.  Each value can declare both physical
# entries in one line: left filters the first character and right filters the
# last character.  A leading '-' in a stroke means right-hand-only; a stroke
# without it is left-hand-only in this section.
#
# This mirrors the existing single-character right-hand auxiliary layout and
# exposes the same 26 shapes on the left for word filtering.  Copy this file
# to Plover's user config directory to change it without editing the package.

[backend]
# native is the default pure-Plover route.  Use line_buffer for the native
# sentence buffer, external_pinyin to feed pinyin into the system IME, or
# rime to explicitly select the bundled librime backend.
# mode = native

[mode_strokes]
# Mode switches use the dictionary-stack plugin when available. These are
# temporary development bindings and can be changed without editing JSON.
native = XU-DG
line_buffer = XU-DZ
external_pinyin = XU-DW

[mode_dictionaries]
# Empty marker dictionaries selected by plover-dict-commands. Keep the
# filenames stable if you use the corresponding entries in yw-gongneng.json.
native = yw-mode-native.json
line_buffer = yw-mode-line-buffer.json
external_pinyin = yw-mode-external-pinyin.json

[native_candidates]
# Optional experimental candidate table.  Leave path empty to use the
# packaged yw-native-candidates.json.  Relative paths are resolved next to
# this CFG; an absolute path is recommended for generated files.
# path = C:\\path\\to\\yw-native-candidates-wanxiang.json

[commands]
# Temporary development bindings only.  Final Chinese/English/symbol/edit
# key choices will be reviewed together after the feature set stabilizes.
# Confirm/commit the current Chinese sentence using the highlighted candidate
# (or the first candidate when no explicit choice was made).
# Values use complete Yawei chords: left hand - right hand.
commit = XNA-G
# Keep a separate force-commit binding for future automatic-top-screen modes.
force_commit = XNA-XW

[line_buffer]
# Keep the Chinese line editable until an explicit commit or an external
# Plover-owned command boundary.
enabled = false
commit_on_prefix_miss = true
flush_before_plover_command = true
show_preedit = true

[candidate_window]
# Optional presentation settings for the native candidate popup.  Invalid
# values fall back independently to the built-in defaults.
# font_family = Segoe UI
# buffer_font_size = 11
# preedit_font_size = 10
# candidate_font_size = 10
# width = 360
# height = 180
# max_candidates = 9
# background = #202124
# foreground = #f8f9fa
# accent = #355070
# position_mode = follow
# fixed_position = bottom_left
# margin = 12

[bindings]
# Leave empty until a physical Yawei chord has passed the conflict check.
force_unbind =

[auxiliary_keys]
q = left:XGINEO right:-XGINEO
w = left:WNEO right:-WNEO
e = left:XNEO right:-XNEO
r = left:XBZNEO right:-XBZNEO
t = left:BDNEO right:-BDNEO
y = left:WINEO right:-WINEO
u = left:UNEO right:-UNEO
i = left:INEO right:-INEO
o = left:NEO right:-NEO
p = left:BGNEO right:-BGNEO
a = left:NEAO right:-NEAO
s = left:XZNEO right:-XZNEO
d = left:DNEO right:-DNEO
f = left:XBUNEO right:-XBUNEO
g = left:GNEO right:-GNEO
h = left:XGNEO right:-XGNEO
j = left:GINEO right:-GINEO
k = left:XBGNEO right:-XBGNEO
l = left:XDNEO right:-XDNEO
z = left:ZNEO right:-ZNEO
x = left:XINEO right:-XINEO
c = left:BZNEO right:-BZNEO
v = left:IUNEO right:-IUNEO
b = left:BNEO right:-BNEO
n = left:XBDNEO right:-XBDNEO
m = left:XBNEO right:-XBNEO
