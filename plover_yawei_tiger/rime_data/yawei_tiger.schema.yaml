schema:
  schema_id: yawei_tiger
  name: Yawei Tiger
  version: "0.1"

engine:
  processors: [ascii_composer, speller, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, fallback_segmentor]
  translators: [table_translator]

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz'
  delimiter: "'"
  auto_select: false
  max_code_length: 32

translator:
  dictionary: yawei_tiger
  # The Plover dictionary is generated and deterministic.  Do not let an
  # earlier mistaken completion learn a shorter code and outrank the exact
  # entry (for example ba'ba -> 爸爸 vs. 叭叭叭).
  enable_user_dict: false
  enable_sentence: true
  # Homophones with auxiliary strokes receive generated exact-code aliases;
  # generic completion stays off so longer phrases cannot outrank them.
  enable_completion: false

menu:
  page_size: 9

key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
