[metadata]
name = plover-multi-candidate
version = 0.1.0
description = Theory-neutral multi-candidate and line-buffer extension for Plover
author = r3n4ive
author_email = 5531047+r3n4ive@users.noreply.github.com
url = https://github.com/r3n4ive/plover-yawei-tiger
license = MIT
keywords = plover_plugin, plover, steno, candidates
classifiers =
    Environment :: Plugins
    Intended Audience :: End Users/Desktop
    Operating System :: Microsoft :: Windows
    Programming Language :: Python :: 3

[options]
packages =
    plover_multi_candidate
package_dir =
    plover_multi_candidate = ../../plover_multi_candidate
include_package_data = False
install_requires =
    plover>=5.4.1

[options.exclude_package_data]
plover_multi_candidate =
    adapters/*.py

[options.entry_points]
plover.extension =
    multi-candidate = plover_multi_candidate.extension:MultiCandidateExtension
plover.gui.qt.tool =
    multi-candidate-settings = plover_multi_candidate.window_settings:CandidateWindowSettings
