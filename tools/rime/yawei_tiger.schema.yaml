schema:
  schema_id: yawei_tiger
  name: Yawei Tiger
  version: "0.1"

engine:
  processors: [ascii_composer, speller, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, fallback_segmentor]
  translators: [table_translator]

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz'
  delimiter: "'"
  auto_select: false
  max_code_length: 32

translator:
  dictionary: yawei_tiger
  enable_user_dict: true
  enable_sentence: true
  enable_completion: false

menu:
  page_size: 9

key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
