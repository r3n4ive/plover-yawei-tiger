# setup.cfg

[metadata]
name = plover-yawei-tiger
version = 1.2.0
description = Chinese Yawei+tiger chorded input system for Plover
long_description = file: README.md
long_description_content_type = text/markdown
author = r3n4ive
author_email = 5531047+r3n4ive@users.noreply.github.com
url = https://github.com/r3n4ive/plover-yawei-tiger
license = MIT
keywords = plover_plugin, plover, steno, yawei, rime
classifiers =
    Environment :: Plugins
    Intended Audience :: End Users/Desktop
    Operating System :: Microsoft :: Windows
    Programming Language :: Python :: 3

[options]
packages = find:
include_package_data = True
install_requires =
    plover>=5.4.1
    hidapi
    plover-multi-candidate>=0.1.0,<0.2

[options.packages.find]
include =
    plover_yawei_tiger
    plover_yawei_tiger.*

[options.extras_require]
dev =
    pytest>=8
    build

[options.package_data]
plover_yawei_tiger =
    dictionaries/*.json
    *.cfg
    theory_map/*.txt
    rime_data/*.yaml

[options.entry_points]
plover.system =
    yawei-tiger = plover_yawei_tiger.system
plover.machine =
    Yawei V3 = plover_yawei_tiger.machine:YaweiV3
plover.extension =
    yawei-rime = plover_yawei_tiger.extension:YaweiRimeExtension
plover.gui.qt.tool =
    yawei-candidate-settings = plover_yawei_tiger.window_settings:YaweiCandidateWindowSettings
